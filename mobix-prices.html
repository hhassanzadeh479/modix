<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOBIX | قیمت خدمات</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#07111f;color:#eef5ff}button,input{font:inherit}.wrap{min-height:100vh;background:linear-gradient(145deg,#07111f,#0b1c31 55%,#082d45);padding:28px 16px}.top{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.logo{font-size:27px;font-weight:900}.logo span{color:#27b8ff}.tag{color:#9eb5cc;font-size:13px}.hero{max-width:1050px;margin:45px auto 28px}.hero h1{font-size:38px;margin:0 0 12px}.hero p{color:#a9bdd1;margin:0;line-height:1.9}.grid{max-width:1050px;margin:28px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#10243a;border:1px solid #23425d;border-radius:20px;padding:22px;box-shadow:0 14px 35px #0005;position:relative}.badge{position:absolute;left:18px;top:18px;background:#27b8ff;color:#06111d;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:bold}.icon{font-size:32px}.card h3{margin:14px 0 8px}.desc{color:#9fb4c8;font-size:13px;min-height:42px}.price{font-size:27px;font-weight:900;margin:20px 0}.price small{font-size:12px;color:#8da5ba;font-weight:normal}.edit{margin-top:12px;display:flex;gap:8px}.edit input{width:100%;background:#091827;border:1px solid #2b4c66;color:white;border-radius:10px;padding:10px}.edit button{border:0;border-radius:10px;padding:10px 13px;background:#27b8ff;color:#06111d;font-weight:bold;cursor:pointer}.note{max-width:1050px;margin:25px auto 0;padding:17px 20px;border-radius:16px;background:#0c1d2f;color:#9eb5cc;border:1px solid #203d56;font-size:13px}.free .price{color:#55e6a5}.footer{max-width:1050px;margin:28px auto 0;color:#718ba1;font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.top{align-items:flex-start;flex-direction:column}.card{padding:20px}}
</style></head><body><main class="wrap"><header class="top"><div class="logo">MOBI<span>X</span> 📱</div><div class="tag">آموزش و خدمات تخصصی موبایل</div></header><section class="hero"><h1>قیمت خدمات</h1><p>قیمت‌ها شفاف، ساده و قابل تغییر؛ خدمات موردنیازت را انتخاب کن.</p></section><section class="grid" id="services"></section><div class="note">💡 قیمت‌ها نمونه هستند و مدیر سایت می‌تواند هر قیمت را مستقیماً در کارت همان خدمت تغییر دهد.</div><div class="footer">© MOBIX — همه خدمات در یک‌جا</div></main><script>
const services=[['📲','انتقال اطلاعات','انتقال اطلاعات بین گوشی‌ها','10','دلار'],['⚙️','تنظیمات و راه‌اندازی','تنظیم و آماده‌سازی گوشی','5','دلار'],['🔐','امنیت موبایل','تنظیمات امنیت و حریم خصوصی','5','دلار'],['🚀','رفع کندی گوشی','بررسی و بهینه‌سازی عملکرد','10','دلار'],['📱','راه‌اندازی گوشی جدید','آماده‌سازی اولیه و انتقال داده','10','دلار'],['💬','مشاوره خرید گوشی','راهنمایی برای انتخاب مناسب','0','رایگان']];
const box=document.querySelector('#services');function render(){box.innerHTML=services.map((s,i)=>`<article class="card ${s[3]==0?'free':''}"><div class="icon">${s[0]}</div><h3>${s[1]}</h3><div class="desc">${s[2]}</div><div class="price">${s[3]==0?'رایگان':s[3]+' '+s[4]} <small>${s[3]==0?'بدون هزینه':''}</small></div><div class="edit"><input id="p${i}" type="number" min="0" value="${s[3]}" aria-label="قیمت ${s[1]}"><button onclick="changePrice(${i})">تغییر</button></div>${s[3]==0?'':`<span class="badge">پیشنهاد MOBIX</span>`}</article>`).join('')}function changePrice(i){const v=document.getElementById('p'+i).value;if(v==='')return;services[i][3]=v;render()}render();
</script></body></html>
